<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDU-TEST-SOFT | Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#e9efe6] min-h-screen font-sans">

    <!-- Header -->
    <header class="h-16 w-full bg-white flex items-center px-6 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 bg-[#39a900] rounded-lg flex items-center justify-center text-white text-lg">
                🎓
            </div>
            <span class="font-bold text-gray-800 tracking-wide">EDU-TEST-SOFT</span>
        </div>
    </header>

    <div class="flex">

        <!-- Main content -->
        <main class="flex-1 h-[calc(100vh-64px)] overflow-y-auto flex items-center justify-center p-6">
            <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
                <h2 class="text-center font-bold text-gray-800 text-lg mb-1">Iniciar Sesión </h2>
                <p class="text-center text-sm text-gray-400 mb-6">Ingresa tus credenciales para acceder al sistema</p>

                <form class="flex flex-col gap-4">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Correo electrónico:</label>
                        <input type="email" id="email" placeholder=""
                            class="w-full bg-gray-50 border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#39a900] focus:border-transparent">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Contraseña:</label>
                        <input type="password" id="password" placeholder=""
                            class="w-full bg-gray-50 border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#39a900] focus:border-transparent">
                    </div>

                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 text-gray-600">
                            <input type="checkbox" class="rounded border-gray-300 text-[#39a900] focus:ring-[#39a900]">
                            Recordarme
                        </label>
                        <a href="#" class="text-[#39a900] font-medium hover:underline">¿Olvidé mi contraseña?</a>
                    </div>
                    <button type="submit"
                        class="w-full bg-[#39a900] text-white font-semibold py-2 px-4 rounded-md hover:bg-[#2e7d00] focus:outline-none focus:ring-2 focus:ring-[#39a900] focus:ring-offset-1" onclick="iniciar()">
                        Iniciar sesión
                    </button>

                    <a href="pagina_principal.html" id="inicio" class="display: none;"></a>      
                </form>
            </div>
        </main>
    </div>
<script src="JS/login.js"></script>
</body>
</html>
