<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-TEST-SOFT</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="flex h-screen">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-[#39a900] text-white">

            <!-- LOGO -->
            <div class="flex items-center gap-3 p-4 border-b border-green-600">
                <div class="bg-white p-2 rounded-lg">
                    <img src="img/30e0ec13-211c-4ae3-9c57-1874f6b2faf1.png" alt="Logo" class="w-8 h-8">
                </div>
                <h1 class="font-bold text-xl">
                    EDU-TEST-SOFT
                </h1>
            </div>

            <!-- MENÚ -->
            <div class="p-4">

                <h2 class="text-sm mb-3 text-green-100">
                    Educativo
                </h2>

                <div class="space-y-2">

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        📋 ¿Qué es plan de pruebas?
                    </button>


                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        📄 ¿Qué es un caso de prueba?
                    </button>

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        📊 ¿Qué métricas hay?
                    </button>

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        🧪 ¿Tipos de pruebas?
                    </button>

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        🎥 Videos tutoriales tipo NotebookLM
                    </button>

                </div>

                <h2 class="text-sm mt-8 mb-3 text-green-100">
                    Ejecución
                </h2>

                <div class="space-y-2">

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        📁 Banco de proyectos
                    </button>

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        📋 Plan de pruebas
                    </button>

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        📄 Casos de pruebas
                    </button>

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        ⚙️ Gestión de pruebas
                    </button>

                    <button
                        class="w-full text-left px-3 py-2 rounded-lg bg-green-600 hover:bg-white hover:text-[#39a900] transition duration-300">
                        📈 Métricas
                    </button>

                </div>

            </div>

        </aside>

        <!-- CONTENIDO -->
        <main class="flex-1">

            <!-- HEADER -->
            <header class="h-16 bg-white shadow flex justify-end items-center px-6">

                <!-- CAMPANA -->
                <button
                    class="relative mr-6 text-2xl hover:text-[#39a900] transition">
                    🔔

                    <span
                        class="absolute -top-1 -right-1 bg-red-500 w-3 h-3 rounded-full">
                    </span>
                </button>

                <!-- USUARIO -->
                <div class="flex items-center gap-3">

                    <div class="text-right">
                        <p class="font-semibold text-gray-800">
                            Sebastian Alejandro Bolaños
                        </p>

                        <p class="text-xs text-gray-500">
                            Estudiante
                        </p>
                    </div>

                    <div
                        class="w-10 h-10 bg-[#39a900] text-white rounded-full flex items-center justify-center font-bold">
                        S
                    </div>

                </div>

            </header>

            <!-- PANEL PRINCIPAL -->
            <section class="p-6">

                <div
                    class="bg-[#edf3ea] rounded-2xl h-[85vh] p-8">

                    <h1
                        class="text-5xl font-bold text-[#39a900] text-center">

                        📄 ¿Qué es un caso de prueba?

                    </h1>

                </div>

            </section>

        </main>

    </div>
</body>
</html>
