<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-TEST-SOFT</title>

    <link rel="stylesheet" href="output.css">
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

    <!-- ===================== MENU ===================== -->
    <aside class="w-80 bg-[#38B000] text-white flex flex-col">

        <!-- Logo -->
        <div class="flex items-center gap-4 p-6 border-b border-green-500">

            <div class="w-16 h-16 bg-white rounded-xl flex items-center justify-center">

                <img src="img/logo.png" class="w-10">

            </div>

            <h1 class="text-4xl font-bold">
                EDU-TEST-SOFT
            </h1>

        </div>

        <!-- Menú -->
        <div class="flex-1 overflow-y-auto px-5 py-6">

            <p class="text-2xl mb-5">Educativo</p>

            <div class="space-y-3">

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    📄 ¿Qué es plan de pruebas?
                </button>

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    📄 ¿Qué es un caso de prueba?
                </button>

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    📊 ¿Qué métricas hay?
                </button>

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    🧪 Tipos de pruebas
                </button>

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    🎥 Videos tutoriales tipo NotebookLM
                </button>

            </div>

            <p class="text-2xl mt-10 mb-5">Ejecución</p>

            <div class="space-y-3">

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    📁 Banco de proyectos
                </button>

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    📋 Plan de pruebas
                </button>

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    📄 Casos de pruebas
                </button>

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    ⚙ Gestión de pruebas
                </button>

                <button class="w-full text-left bg-green-500 hover:bg-green-600 rounded-xl p-4">
                    📈 Métricas
                </button>

            </div>

        </div>

    </aside>

    <!-- ===================== CONTENIDO ===================== -->
    <div class="flex-1 flex flex-col">

        <!-- Header -->
        <header class="bg-white h-24 shadow flex justify-end items-center px-10">

            <div class="flex items-center gap-8">

                <!-- Campana -->
                <div class="relative">

                    <span class="text-4xl">🔔</span>

                    <div class="absolute top-1 right-1 w-3 h-3 rounded-full bg-red-500"></div>

                </div>

                <!-- Usuario -->
                <div class="text-right">

                    <h2 class="text-2xl font-semibold">
                        Sebastian Alejandro Bolaños
                    </h2>

                    <p class="text-gray-500">
                        Estudiante
                    </p>

                </div>

                <!-- Avatar -->
                <div class="w-14 h-14 rounded-full bg-[#38B000] flex items-center justify-center text-white text-2xl font-bold">
                    S
                </div>

            </div>

        </header>

        <!-- Contenido -->
        <main class="flex-1 p-6">

            <div class="bg-[#F3FAF0] rounded-3xl h-full">

                <div class="flex justify-center items-center gap-5 pt-10">

                    <span class="text-6xl">📄</span>

                    <h1 class="text-6xl font-bold text-[#38B000]">
                        ¿Qué métricas hay?
                    </h1>

                </div>

            </div>

        </main>

    </div>

</div>

</body>
</html>
